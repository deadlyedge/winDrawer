[startup]
# 启动与主窗口设置
# 配置登录启动、显示/隐藏快捷键、窗口行为、主题颜色、主窗口高度和抽屉条目上限。
start_with_windows = false
window_locked = false
always_on_top = false
toggle_hotkey_enabled = true
window_position = [109, 13]
window_color = "#000533"
window_opacity = 95
window_height = 200
max_drawer_items = 200
animation_frame_ms = 15

# 首次启动时使用的示例抽屉；已存在的配置文件不会被模板覆盖。
# winDrawer 抽屉指向本配置目录，demoDrawer 存放示例文件（首次运行时写入）。
[[drawers]]
name = "winDrawer"
path = "%USERPROFILE%\\.config\\winDrawer"

[[drawers]]
name = "demoDrawer"
path = "%USERPROFILE%\\.config\\winDrawer\\demoDrawer"